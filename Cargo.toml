[package]
name = "shell"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
env_logger = "0.11.10"
futures-util = "0.3.32"
log = "0.4"
pulse = { version = "2.26.0", package = "libpulse-binding" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full", "net"] }
tokio-udev = "0.10.0"
udev = { version = "^0.9.3", features = ["send"] }
zbus = { version = "5.15.0", features = ["tokio"] }
